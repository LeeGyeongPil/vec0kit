# 키·모델·네트워크 없이 전체 흐름을 검증한다(재임베딩은 연습용 목 임베더와 로컬 HTTP 스텁).
name: ci
on:
  push:
  pull_request:
  schedule:
    - cron: "17 3 * * 1"   # 매주 월요일 — 의존성·런타임이 바뀌어 깨지지 않았는지 정기 확인
  workflow_dispatch:
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        node: [22, 24, 26]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      # 처음 실행 흐름(demo)이 끝까지 도는지 — 레포 밖 임시 폴더에서 실행
      - name: demo
        run: |
          mkdir -p "$RUNNER_TEMP/demo"
          cd "$RUNNER_TEMP/demo"
          node "$GITHUB_WORKSPACE/dist/cli.js" demo
